<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateful — Food Delivery Prototype</title>
<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --ink:#1F1B16; --ink-2:#5C554C; --ink-3:#8C847A;
  --line:#ECE5DA; --brand:#D9480F; --brand-2:#FFF0E8; --brand-ink:#A8370A;
  --ok:#2B8A3E; --ok-bg:#EBF8EE; --warn:#B35C00; --warn-bg:#FFF4E0; --err:#C92A2A; --err-bg:#FFF0F0;
  --info:#1C5D99; --info-bg:#EAF3FC;
  --r:14px; --r-sm:10px; --shadow:0 1px 2px rgba(31,27,22,.06),0 4px 16px rgba(31,27,22,.06);
  --fs:15px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.45;-webkit-font-smoothing:antialiased}
body.simple{--fs:17px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-ink)}
:focus-visible{outline:3px solid #F59F00;outline-offset:2px;border-radius:6px}
main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.3px;color:var(--ink);text-decoration:none;background:none;border:0;padding:0}
.logo-mark{width:32px;height:32px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:17px}
.addr{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:4px 8px;border-radius:8px;text-align:left}
.addr small{color:var(--ink-3);font-size:12px}
.addr b{font-size:14px;white-space:nowrap}
.addr:hover{background:var(--bg)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-width:0}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--ink-2);font-weight:600}
.nav button.on{background:var(--brand-2);color:var(--brand-ink)}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:700;white-space:nowrap}
.cartbtn .n{background:var(--brand);border-radius:999px;padding:0 7px;font-size:12px}

/* ---------- Layout ---------- */
main{max-width:1200px;margin:0 auto;padding:20px 20px 120px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.4px}
h2{font-size:19px;margin:28px 0 12px;letter-spacing:-.2px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600}
.btn:hover{border-color:#D8CDBD}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.block{width:100%;padding:13px 16px;font-size:16px}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:600;background:var(--bg);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.brand{background:var(--brand-2);color:var(--brand-ink);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.banner{border-radius:var(--r-sm);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-bg);color:#6B3A00}
.banner.info{background:var(--info-bg);color:#123E66}
.banner.ok{background:var(--ok-bg);color:#1C5B2A}
.banner.err{background:var(--err-bg);color:#7A1A1A}
.hide{display:none!important}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- Chips / categories ---------- */
.scroller{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.cat{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:92px;font-weight:600;font-size:13.5px}
.cat span{font-size:26px}
.cat.on{border-color:var(--brand);background:var(--brand-2);color:var(--brand-ink)}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.active-filters .pill button{border:0;background:none;padding:0 0 0 2px;font-weight:800;color:inherit}

/* ---------- Restaurant cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.rcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(31,27,22,.1)}
.art{height:130px;display:grid;place-items:center;font-size:58px;position:relative}
.art .tag{position:absolute;left:10px;top:10px}
.rcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.rcard .name{font-weight:700;font-size:16px}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:13.5px}
.star{color:#E67700;font-weight:700}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,280px);gap:16px;overflow-x:auto;padding-bottom:6px}

.reorder{display:flex;gap:12px;align-items:center;padding:12px;min-width:280px}
.reorder .ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:28px;flex:0 0 auto}

/* ---------- Restaurant page ---------- */
.two{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.hero{border-radius:var(--r);height:180px;display:grid;place-items:center;font-size:84px;margin-bottom:16px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.fact small{display:block;color:var(--ink-3);font-size:12px}
.fact b{font-size:15px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 8px;position:sticky;top:61px;background:var(--bg);z-index:5;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.item{display:flex;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%}
.item:hover{border-color:#D8CDBD}
.item .ph{width:92px;height:92px;border-radius:12px;display:grid;place-items:center;font-size:44px;flex:0 0 auto}
body.simple .item .ph{width:110px;height:110px;font-size:54px}
.item .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item .desc{color:var(--ink-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.items{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bundle{display:flex;gap:14px;padding:14px;border-radius:var(--r);background:linear-gradient(135deg,#FFF0E8,#FFF9F3);border:1px solid #F7D5C2;text-align:left;width:100%}
.review{padding:14px;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:0}
.bars .b{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.bars .track{flex:1;height:7px;background:var(--line);border-radius:9px;overflow:hidden}
.bars .fill{height:100%;background:#E67700;border-radius:9px}

/* ---------- Cart side ---------- */
.side{position:sticky;top:80px}
.cline{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.cline:last-child{border-bottom:0}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{border:0;background:none;width:30px;height:30px;font-weight:800;font-size:16px}
.qty span{min-width:18px;text-align:center;font-weight:700;font-size:14px}
.sumrow{display:flex;justify-content:space-between;padding:4px 0;color:var(--ink-2)}
.sumrow.total{color:var(--ink);font-weight:800;font-size:18px;padding-top:10px;border-top:1px solid var(--line);margin-top:6px}
.sumrow.disc{color:var(--ok)}
.info-i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--line);font-size:10px;font-weight:800;color:var(--ink-2);margin-left:4px;cursor:help}
.floatbar{display:none}

/* ---------- Checkout ---------- */
.section{margin-bottom:16px}
.section h3{display:flex;align-items:center;gap:8px}
.section h3 .num{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:10px 0 4px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:#fff}
.input:focus{outline:2px solid var(--brand);border-color:transparent}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1 1 150px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:#fff;text-align:left}
.opt.on{border-color:var(--brand);background:var(--brand-2)}
.opt b{display:block}
.opt small{color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;padding:8px 0}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.person{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:13.5px}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.mobile-total{display:none}

/* ---------- Tracking ---------- */
.map{position:relative;height:300px;border-radius:var(--r);overflow:hidden;background:#EDE8DF;border:1px solid var(--line)}
.map svg{width:100%;height:100%;display:block}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px;position:relative;padding-bottom:18px}
.timeline li:last-child{padding-bottom:0}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--line)}
.timeline li.done:not(:last-child)::after{background:var(--ok)}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;flex:0 0 auto;display:grid;place-items:center;font-size:12px;color:#fff;font-weight:800}
.timeline li.done .dot{background:var(--ok);border-color:var(--ok)}
.timeline li.now .dot{border-color:var(--brand);background:var(--brand);box-shadow:0 0 0 5px var(--brand-2)}
.eta-big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.proto{border:1.5px dashed #CDBFAB;border-radius:var(--r-sm);padding:10px 12px;background:#FFFDF9}

/* ---------- Account ---------- */
.meter{height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:9px}
.chart{display:flex;align-items:flex-end;gap:12px;height:140px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;max-width:44px;border-radius:8px 8px 4px 4px;background:#F2C6AE}
.chart .bar.cur{background:var(--brand)}
.switch{position:relative;width:46px;height:26px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#D6CCBF;border-radius:99px;transition:.15s}
.switch span::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::before{transform:translateX(20px)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}

/* ---------- Modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(31,27,22,.45);z-index:80;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:18px;width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-b{padding:16px 18px;overflow:auto}
.modal-f{padding:14px 18px;border-top:1px solid var(--line);background:#fff}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:18px;flex:0 0 auto}
.group-h{display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;cursor:pointer}
.choice.on{border-color:var(--brand);background:var(--brand-2)}
.choice input{accent-color:var(--brand);width:18px;height:18px}
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nutri div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.nutri b{display:block;font-size:15px}
.nutri small{color:var(--ink-3);font-size:11.5px}
.toasts{position:fixed;top:72px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;animation:tin .25s ease}
.toast small{color:#CFC6BA;display:block}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

.tabbar{display:none}
.footer{max-width:1200px;margin:0 auto;padding:0 20px 30px;color:var(--ink-3);font-size:12.5px}

/* ---------- Simple mode ---------- */
body.simple .promo-only{display:none!important}
body.simple .rcard .art{height:110px}

/* ---------- Responsive: tablet ---------- */
@media (max-width:980px){
  .two{grid-template-columns:1fr}
  .side.cart-side{display:none}
  .floatbar{display:flex;position:fixed;left:16px;right:16px;bottom:84px;z-index:30;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border:0;border-radius:16px;padding:14px 18px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .nav{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink-3);padding:6px 0;position:relative}
  .tabbar button span{font-size:20px;line-height:1}
  .tabbar button.on{color:var(--brand-ink)}
  .tabbar .badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--brand);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
  .cartbtn{display:none}
  .co-side{position:static}
  .mobile-total{display:flex;position:fixed;left:0;right:0;bottom:64px;z-index:30;background:#fff;border-top:1px solid var(--line);padding:12px 16px;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
  .co-side .placebtn{display:none}
}
/* ---------- Responsive: phone ---------- */
@media (max-width:640px){
  .topbar-in{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .search{order:3;flex-basis:100%}
  .addr{margin-left:auto}
  main{padding:14px 14px 150px}
  h1{font-size:22px}
  .facts{grid-template-columns:repeat(2,1fr)}
  .items{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .hero{height:140px;font-size:64px}
  .tabs{top:105px}
  .grid2{grid-template-columns:1fr}
  .scrim{align-items:end;padding:0}
  .modal{width:100%;border-radius:20px 20px 0 0;max-height:92vh}
  .toasts{left:12px;right:12px;top:auto;bottom:150px;max-width:none}
  .map{height:230px}
  .hscroll{grid-auto-columns:82%}
  .item .ph{width:76px;height:76px;font-size:36px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <button class="logo" onclick="go('home')" aria-label="Plateful home"><span class="logo-mark">🍽</span>Plateful</button>
    <button class="addr" onclick="openAddress()" aria-label="Change delivery address">
      <small>Deliver to</small><b id="addrLabel">Home · 221 Elm St ▾</b>
    </button>
    <label class="search" role="search">
      <span aria-hidden="true">🔎</span>
      <span class="sr">Search restaurants or dishes</span>
      <input id="q" type="search" placeholder="Search restaurants, cuisines or dishes" oninput="onSearch(this.value)">
    </label>
    <nav class="nav" aria-label="Main">
      <button data-nav="home" onclick="go('home')">Discover</button>
      <button data-nav="orders" onclick="go('orders')">Orders</button>
      <button data-nav="account" onclick="go('account')">Account</button>
    </nav>
    <button class="cartbtn" onclick="go('checkout')">🛒 Cart <span class="n" id="cartN">0</span></button>
  </div>
</header>

<main id="app" tabindex="-1"></main>
<div class="footer">Plateful prototype · built from the Food Delivery App PRD v1.0 (16 Nov 2026). Sample data only.</div>

<nav class="tabbar" aria-label="Main (mobile)">
  <button data-nav="home" onclick="go('home')"><span>🏠</span>Discover</button>
  <button data-nav="search" onclick="focusSearch()"><span>🔎</span>Search</button>
  <button data-nav="checkout" onclick="go('checkout')"><span>🛒</span>Cart<i class="badge hide" id="cartN2">0</i></button>
  <button data-nav="orders" onclick="go('orders')"><span>🧾</span>Orders</button>
  <button data-nav="account" onclick="go('account')"><span>👤</span>Account</button>
</nav>

<div id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* =========================================================
   DATA
   ========================================================= */
const OPT = {
  size:{name:'Size',required:true,choices:[['Regular',0],['Large',3]]},
  spice:{name:'Spice level',required:true,choices:[['Mild',0],['Medium',0],['Hot',0]]},
  protein:{name:'Protein',required:true,choices:[['Chicken',0],['Tofu',0],['Beef',2],['Shrimp',3]]},
  addon:{name:'Add-ons',required:false,multi:true,choices:[['Extra cheese',1.5],['Avocado',2],['Fried egg',1.5]]},
  side:{name:'Side',required:true,choices:[['Fries',0],['Side salad',0],['Sweet potato fries',1.5]]},
  drink:{name:'Add a drink',required:false,multi:true,choices:[['Lemonade',2.5],['Iced tea',2.5],['Sparkling water',2]]},
  crust:{name:'Crust',required:true,choices:[['Classic',0],['Thin',0],['Gluten-free',3]]},
};
const R = [
 {id:'r1',name:"Nonna's Kitchen",e:'🍝',bg:'#F8DCC8',cuisine:'Italian',cat:'italian',rating:4.7,reviews:1240,eta:[25,35],fee:1.99,price:2,onTime:94,tags:['veg','kid'],
  menu:[

function clock(minFromNow){const d=new Date(Date.now()+minFromNow*60000);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function reliability(r){
  if(r.onTime>=90) return `<span class="pill ok" title="Share of orders delivered within the estimated window, last 30 days">✓ On time ${r.onTime}%</span>`;
  if(r.onTime<80) return `<span class="pill warn" title="Recent orders often arrived after the estimate">⚠ Recent delays</span>`;
  return `<span class="pill" title="Share of orders delivered within the estimated window, last 30 days">On time ${r.onTime}%</span>`;
}
function tagPills(tags){
  const map={veg:['🌱 Vegetarian','ok'],kid:['🧒 Kid-friendly','info'],healthy:['💚 Healthy','ok'],spicy:['🌶 Spicy','warn']};
  return tags.map(t=>map[t]?`<span class="pill ${map[t][1]}">${map[t][0]}</span>`:'').join(' ');
}
function toast(title,sub,icon='🔔'){
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=`<div style="font-size:20px">${icon}</div><div><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div>`;
  const T=$('#toasts');T.appendChild(el);while(T.children.length>2)T.firstChild.remove();setTimeout(()=>el.remove(),4200);
}

/* =========================================================

   ========================================================= */
function lineTotal(l){return l.unit*l.qty}
function totals(){
  const r=S.cart.rid?rest(S.cart.rid):null;
  const sub=S.cart.lines.reduce((a,l)=>a+lineTotal(l),0);
  const delivery=r?r.fee:0;
  const service=sub?Math.max(1.5,sub*0.06):0;
  const promoOK=sub>=15;
  const discount=(S.promo&&promoOK)?Math.min(5,sub*0.10):0;
  const tax=(sub-discount)*0.08;
  const tip=(sub)*S.tipPct/100;
  const total=sub+delivery+service+tax+tip-discount;
  return {sub,delivery,service,discount,tax,tip,total,promoOK};
}
let PENDING=null;
function askReplace(rid,cb){
  PENDING=()=>{S.cart.lines=[];S.cart.rid=null;cb()};
  modal(`<div class="modal-h"><b style="font-size:18px">Start a new cart?</b><button class="x" aria-label="Close" onclick="closeModal()">×</button></div>
   <div class="modal-b"><p style="margin:0">Your cart has items from <b>${esc(rest(S.cart.rid).name)}</b>. You can order from one restaurant at a time. Clear it and start a new cart with <b>${esc(rest(rid).name)}</b>?</p></div>
   <div class="modal-f row"><button class="btn" onclick="closeModal()">Keep current cart</button><button class="btn primary" style="margin-left:auto" onclick="PENDING&&PENDING()">Start new cart</button></div>`);
}
function cartCount(){return S.cart.lines.reduce((a,l)=>a+l.qty,0)}
function addToCart(rid,line,silent){
  if(S.cart.rid&&S.cart.rid!==rid&&S.cart.lines.length){
    askReplace(rid,()=>{addToCart(rid,line,silent);closeModal();render();});
    return false;
  }
  S.cart.rid=rid;
  const same=S.cart.lines.find(l=>l.mid===line.mid&&l.opts===line.opts&&l.who===line.who);
  if(same) same.qty+=line.qty; else S.cart.lines.push({...line,key:Math.random().toString(36).slice(2,8)});
  updateBadges();
  if(!silent) toast('Added to cart',`${line.qty} × ${line.name}`,'🛒');
  return true;
}
function changeQty(key,d){
  const l=S.cart.lines.find(x=>x.key===key);if(!l)return;
  l.qty+=d;if(l.qty<=0)S.cart.lines=S.cart.lines.filter(x=>x.key!==key);
  if(!S.cart.lines.length)S.cart.rid=null;
  updateBadges();render();
}
function updateBadges(){
  const n=cartCount();$('#cartN').textContent=n;$('#cartN').classList.toggle('hide',!n);
  const b=$('#cartN2');b.textContent=n;b.classList.toggle('hide',!n);
}
function summaryHTML(opts={}){
  const t=totals();
  const tipBtns=[0,10,15,20].map(p=>`<button class="chip ${S.tipPct===p?'on':''}" onclick="S.tipPct=${p};render()">${p?p+'%':'No tip'}</button>`).join('');
  return `

   <div class="sumrow"><span>Delivery fee <span class="info-i" title="Set by distance and restaurant. Shown on every restaurant card.">i</span></span><span>${t.delivery?money(t.delivery):'Free'}</span></div>

/* ---------- Item customization modal (FR-13, FR-15) ---------- */
let IM=null;
function openItem(rid,mid){
  const m=findItem(rid,mid);
  IM={rid,mid,qty:1,sel:{},who:S.group.people[0]};
  m.opts.forEach(k=>{const o=OPT[k];IM.sel[k]=o.required?[0]:[]});

}
function itemUnit(){
  const m=findItem(IM.rid,IM.mid);let u=m.p;
  m.opts.forEach(k=>IM.sel[k].forEach(i=>u+=OPT[k].choices[i][1]));return u;
}
function selText(){
  const m=findItem(IM.rid,IM.mid);
  return m.opts.flatMap(k=>IM.sel[k].map(i=>OPT[k].choices[i][0])).join(' · ');
}
function pick(k,i){
  const o=OPT[k];
  if(o.multi){const s=IM.sel[k];IM.sel[k]=s.includes(i)?s.filter(x=>x!==i):[...s,i]}else IM.sel[k]=[i];

     ${o.choices.map((c,i)=>{const on=IM.sel[k].includes(i);return `<label class="choice ${on?'on':''}"><span class="row"><input type="${o.multi?'checkbox':'radio'}" name="${k}" ${on?'checked':''} onchange="pick('${k}',${i})">${c[0]}</span><span class="muted">${c[1]?'+'+money(c[1]):''}</span></label>`}).join('')}`}).join('');
  const nut=m.cal?`<div class="nutri"><div><b>${m.cal}</b><small>Calories</small></div><div><b>${m.pro}g</b><small>Protein</small></div><div><b>${m.sod}mg</b><small>Sodium</small></div><div><b>${m.sod<=500?'Low':m.sod<=1200?'Med':'High'}</b><small>Sodium level</small></div></div><div class="tiny" style="margin-top:6px">Nutrition provided by the restaurant, for the regular size.</div>`
    :`<div class="banner info"><span>ℹ</span><div>This restaurant hasn’t provided nutrition information for this item. We don’t estimate it.</div></div>`;
  const people=S.group.on?`<div class="group-h"><b>Who is this for?</b><span class="pill">Group order</span></div><div class="seg">${S.group.people.map(p=>`<button class="chip ${IM.who===p?'on':''}" onclick="IM.who='${esc(p)}';modalItem()">${esc(p)}</button>`).join('')}</div>`:'';
  modal(`
   <div class="modal-h"><b style="font-size:18px">${esc(m.name)}</b><button class="x" aria-label="Close" onclick="closeModal()">×</button></div>
   <div class="modal-b">
     <div style="height:170px;border-radius:14px;background:${r.bg};display:grid;place-items:center;font-size:84px">${m.e}</div>
     <p style="margin:12px 0 6px">${esc(m.d)}</p>
     <div class="row wrap" style="gap:6px;margin-bottom:12px">${tagPills(m.tags)}</div>
     ${nut}
     ${groups}
     ${people}
     <label class="f" for="note">Special instructions (optional)</label>
     <input id="note" class="input" placeholder="e.g. no onions">
   </div>
   <div class="modal-f">
     ${m.opts.length?`<div class="tiny" style="margin-bottom:8px">Your selection: <b style="color:var(--ink)">${esc(selText()||'—')}</b></div>`:''}
     <div class="row">
       <div class="qty"><button aria-label="Decrease" onclick="IM.qty=Math.max(1,IM.qty-1);modalItem()">−</button><span>${IM.qty}</span><button aria-label="Increase" onclick="IM.qty++;modalItem()">+</button></div>
       <button class="btn primary block" style="flex:1" onclick="confirmItem()">Add ${IM.qty} to cart · ${money(itemUnit()*IM.qty)}</button>
     </div>
   </div>`);
}

  const m=findItem(IM.rid,IM.mid);

function drawMap(){
  const el=$('#map');if(!el||!S.order)return;
  const p=[[60,250],[160,250],[160,150],[330,150],[330,70],[520,70]];
  const prog=[0,0,.15,.6,1][S.order.stage];
  // point along polyline
  let L=[],tot=0;for(let i=1;i<p.length;i++){const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);L.push(d);tot+=d}
  let want=tot*prog,x=p[0][0],y=p[0][1];for(let i=1;i<p.length;i++){if(want<=L[i-1]){const f=L[i-1]?want/L[i-1]:0;x=p[i-1][0]+(p[i][0]-p[i-1][0])*f;y=p[i-1][1]+(p[i][1]-p[i-1][1])*f;break}want-=L[i-1];x=p[i][0];y=p[i][1]}
  const pts=p.map(q=>q.join(',')).join(' ');
  el.innerHTML=`<svg viewBox="0 0 580 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

    ${[40,110,200,290,380,470].map(v=>`<line x1="${v}" y1="0" x2="${v}" y2="320" stroke="#fff" stroke-width="10"/>`).join('')}

    <rect x="410" y="140" width="110" height="90" rx="10" fill="#D7E6F2"/>
    <polyline points="${pts}" fill="none" stroke="#D9480F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 10" opacity=".55"/>
    <g><circle cx="60" cy="250" r="16" fill="#fff" stroke="#1F1B16" stroke-width="2"/><text x="60" y="256" font-size="16" text-anchor="middle">${rest(S.order.rid).e}</text></g>

    ${S.order.stage>=2?`<g><circle cx="${x}" cy="${y}" r="22" fill="#D9480F" opacity=".18"/><circle cx="${x}" cy="${y}" r="15" fill="#D9480F"/><text x="${x}" y="${y+5}" font-size="15" text-anchor="middle">🛵</text></g>`:''}
  </svg>
  <div style="position:absolute;left:12px;top:12px" class="pill">${S.order.stage>=2?'📍 Live driver location':'Driver location appears after pickup'}</div>`;
}

let lastFocus=null;
function modal(html){
  if(!$('#modalRoot').innerHTML) lastFocus=document.activeElement;
  $('#modalRoot').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=$('#modalRoot .modal button, #modalRoot .modal input');if(f)f.focus({preventScroll:true});
}
function closeModal(){$('#modalRoot').innerHTML='';if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal()});
